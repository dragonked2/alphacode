name: publish crate

# Publishing to crates.io from a workstation is unreliable for this crate:
# the .crate is ~7 MiB and crates.io's edge aborts a publish request that
# takes longer than ~35 s to arrive. On a slow or proxied uplink the upload
# is cut off with `failed to get a 200 OK response, got 408` long before the
# tarball is transferred, and nothing is published.
#
# A GitHub-hosted runner has a fast, unthrottled uplink, so it is the reliable
# place to publish from. The token lives in the `CARGO_REGISTRY_TOKEN` secret
# and needs the `publish-new-crate` scope the first time a crate is created.

on:
  workflow_dispatch:
    inputs:
      crate:
        description: "Which package to publish"
        required: true
        default: alphacode
        type: choice
        options: [alphacode, alphagrep]
      dry_run:
        description: "Verify the publish without uploading (run this first)"
        required: true
        default: true
        type: boolean
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    name: publish ${{ inputs.crate || 'alphacode' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1

      # libxkbcommon is a hard link-time dependency on Linux.
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev

      # A tag names the alphacode release, so refuse to publish a version that
      # does not match the tag: crates.io versions are immutable and a mismatch
      # would burn the tag's version number on the wrong build.
      - name: Check the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="alphacode"))')"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match the alphacode version $manifest_version" >&2
            exit 1
          fi

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATE: ${{ inputs.crate || 'alphacode' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            cargo publish -p "$CRATE" --dry-run
          else
            cargo publish -p "$CRATE"
          fi
