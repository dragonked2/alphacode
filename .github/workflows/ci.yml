name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  RUSTFLAGS: "-D warnings"
  # Test binaries are large; omit debug symbols to keep linking and cache
  # uploads within runner disk and time budgets. Backtraces retain names.
  CARGO_PROFILE_TEST_DEBUG: "0"

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }} / ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            profile: release
          - os: macos-15-intel
            target: x86_64-apple-darwin
            profile: release
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            profile: release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # `xa11y`'s Linux accessibility backend links the system libxkbcommon.
          # Without the -dev package (which provides the `libxkbcommon.so`
          # symlink used by `-lxkbcommon`) the build fails with:
          #   rust-lld: error: unable to find library -lxkbcommon
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: clippy, rustfmt
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Save on main so tagged releases can restore this cache. GitHub
          # cannot restore a cache saved only under an earlier release tag.
          key: release-v2-${{ runner.os }}-${{ matrix.target }}-1.94.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            release-v2-${{ runner.os }}-${{ matrix.target }}-1.94.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}-
            release-v2-${{ runner.os }}-${{ matrix.target }}-1.94.1-

      - name: Setup Node.js for GUI frontend build
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/cli/gui/ui/package-lock.json

      - name: Build GUI frontend assets
        working-directory: src/cli/gui/ui
        run: |
          npm ci
          npm run build

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # A release build must not embed the builder's absolute paths. `strip`
      # drops the symbol table but not the `file!()` string literals every
      # dependency emits, so a plain `cargo build --release` carries the build
      # account's home directory thousands of times. That is a privacy leak and
      # a reputation signal (see docs/engineering/windows-av-false-positive.md),
      # and the Windows PE guard below rejects it: an unsigned PE full of one
      # account's paths reads as a dropped payload.
      #
      # release.yml and scripts/release-build.sh already pass these remaps. This
      # job builds the same artifact to run the same guards, so it must match
      # them or the guard fails on an otherwise-correct binary -- which is what
      # happened the first time the guard ran here (`runneradmin`, ~2,000 hits).
      # Windows only: the guard and the GUI host it inspects exist only there.
      - name: Record the build path the Windows PE guard must not find
        if: runner.os == 'Windows'
        id: remap
        shell: bash
        run: echo "marker=$(cygpath -m "$USERPROFILE")" >> "$GITHUB_OUTPUT"

      - name: cargo build --release
        shell: bash
        env:
          REMAP_MARKER: ${{ steps.remap.outputs.marker }}
          ALPHACODE_REQUIRE_GUI_ASSETS: "1"
        run: |
          set -euo pipefail
          # `${REMAP_MARKER:-}` is empty on non-Windows runners, so the branch is
          # skipped before `cygpath` (which does not exist there) is reached.
          if [ -n "${REMAP_MARKER:-}" ]; then
            workspace="$(cygpath -m "$PWD")"
            registry="$(cygpath -m "$HOME/.cargo/registry")"
            export RUSTFLAGS="${RUSTFLAGS:-} --remap-path-prefix=${workspace}=/alphacode --remap-path-prefix=${registry}=/cargo/registry"
            # Tell the guard which profile path to search for; it cannot infer
            # the CI account name otherwise and would silently skip the check.
            export ALPHACODE_BUILD_PATH_MARKER="$REMAP_MARKER"
          fi
          cargo build --release --locked --target ${{ matrix.target }} --bin alphacode

      - name: Verify embedded GUI assets are present in release binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/alphacode"
          [ -f "${BIN}.exe" ] && BIN="${BIN}.exe"
          test -f "$BIN" || { echo "::error::$BIN was not produced"; exit 1; }
          for needle in ALPHACODE_EMBEDDED_GUI_UI_V1 index.html; do
            if ! grep -aq -- "$needle" "$BIN"; then
              echo "::error file=build.rs::embedded GUI marker '$needle' missing from $BIN"
              exit 1
            fi
          done
          echo "OK: embedded GUI frontend bundle verified in $BIN"

      # Structural release guards, run on every PR rather than only at tag time.
      # `release.yml` catches a bad artifact only after a tag is pushed; these
      # catch the same regression on the pull request that introduces it.
      # Windows only, because the GUI host and the VERSIONINFO resource are
      # Windows-specific and `build.rs` stages the host beside the binary.
      - name: Reject nested-executable, overlay and unattributed PEs
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/alphacode.exe"
          HOST="target/${{ matrix.target }}/release/AlphaCode.Desktop.exe"
          test -f "$HOST" || { echo "::error::$HOST was not produced"; exit 1; }
          # `alphacode.exe` must not embed a second PE (1.0.92 `Gen:Variant.Barys`).
          python scripts/verify-pe-single-image.py "$BIN"
          python scripts/verify-pe-single-image.py "$HOST"
          # Neither binary may carry a PE overlay, lack VERSIONINFO in the mapped
          # image, or embed the build machine's profile path (1.1.21 host flags).
          python scripts/verify-pe-metadata.py "$BIN"
          python scripts/verify-pe-metadata.py "$HOST"
          # The host embeds `gui.ps1`, so it needs the AV-trigger scan too.
          python scripts/verify-no-av-triggers.py "$BIN"
          python scripts/verify-no-av-triggers.py "$HOST"

  test:
    name: test (${{ matrix.os }})
    env:
      # Deterministic color-enabled rendering baseline; production NO_COLOR
      # behavior is unchanged. Performance gates below still use release mode.
      NO_COLOR: ""
      COLORTERM: truecolor
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # See the build job: libxkbcommon is a hard link-time dep on Linux.
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: clippy
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-opt0-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-test-opt0-${{ matrix.os }}-
      - run: cargo test --lib --locked -- --test-threads=4
      - run: cargo test --test llamacpp_compat --locked
      - run: cargo test --test provider_request_audit --locked
      - name: Verify production accessibility preferences in isolated processes
        run: cargo test --test render_preferences --locked
      # `alphagrep` is its own workspace member, so root-package commands
      # never run its tests; gate them here.
      - run: cargo test -p alphagrep --locked

  perf-gates:
    name: perf gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          # See the build job: libxkbcommon is a hard link-time dep on Linux.
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: clippy
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-perf-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
            cargo-
      # Release profile: the budgets and the scaling curves are only
      # meaningful against the build that ships. `--test-threads=1` because the
      # gates compare timings and must not contend with each other.
      #
      # These fail on hardware-independent complexity regressions only. The
      # wall-clock budgets inside the suite are reported but not enforced on a
      # shared runner; see the module docs in tests/perf_gates.rs for why
      # enforcing them in CI would produce flaky, unactionable failures.
      - run: >
          cargo test --release --locked --test perf_gates
          -- --nocapture --test-threads=1

  lint:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          # See the build job: libxkbcommon is a hard link-time dep on Linux.
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: clippy
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-lint-${{ hashFiles('Cargo.lock') }}
      - run: cargo clippy --locked --lib --all-targets -- -D warnings
      # Same gap as in the test job: the workspace member needs its own run.
      - run: cargo clippy -p alphagrep --locked --all-targets -- -D warnings
      - name: Verify Linux musl build does not pull gtk/webkit2gtk
        shell: bash
        run: |
          set -euo pipefail
          if cargo tree --locked --target x86_64-unknown-linux-musl --prefix none \
            | grep -Eq '^(gtk|gtk-sys|webkit2gtk|webkit2gtk-sys|tao|wry|soup3|javascriptcore-rs) '; then
            echo "::error::x86_64-unknown-linux-musl unexpectedly depends on gtk/webkit2gtk/tao/wry"
            exit 1
          fi
          echo "OK: x86_64-unknown-linux-musl has no gtk/webkit2gtk/tao/wry dependencies"

  gui-diagnostics:
    name: Windows GUI diagnostics
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      # The shipped WPF host uses .NET Framework and Windows PowerShell 5.1,
      # including System.Web.Extensions. PowerShell 7 cannot compile this host.
      - name: Verify callback recovery and diagnostic privacy
        shell: powershell
        run: ./scripts/tests/gui-callback.tests.ps1

  installer-smoke:
    name: installer smoke
    runs-on: ubuntu-24.04
      # Sanity-check the install scripts' syntax without actually
      # downloading a release (we don't have one in CI).
    steps:
      - uses: actions/checkout@v5
      - name: bash -n scripts/install.sh
        run: bash -n scripts/install.sh
      - name: bash -n scripts/uninstall.sh
        run: bash -n scripts/uninstall.sh
      - name: pwsh parse check on the PowerShell scripts
        shell: pwsh
        run: |
          # Parse, do not tokenize. PSParser::Tokenize only splits text into
          # tokens and never checks that they form a valid script, so it passes
          # on files that cannot actually run.
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path scripts -Recurse -Filter '*.ps1'
          if ($files.Count -eq 0) { throw 'no .ps1 scripts found' }
          foreach ($f in $files) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $f.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              foreach ($e in $errors) { Write-Host "::error file=$($f.FullName):: $($e.Message)" }
              throw "parse errors in $($f.Name)"
            }
          }
          Write-Host "parsed $($files.Count) PowerShell script(s)"

      - name: PowerShell scripts have Windows-compatible encoding
        shell: pwsh
        run: |
          # install.ps1 is distributed as `iwr ... | iex` and is routinely run by
          # Windows PowerShell 5.1, which decodes a BOM-less file as the
          # ANSI code page. In CP1252 the byte 0x94 is a right double quote, so a
          # UTF-8 em dash (E2 80 94) decodes to mojibake *plus a closing quote*
          # and silently truncates the surrounding string into a syntax error.
          # install.ps1 already carried one em dash and CI's Tokenize check
          # could not have caught it. Keep these files ASCII.
          $ErrorActionPreference = 'Stop'
          $bad = @()
          foreach ($f in Get-ChildItem -Path scripts -Recurse -Filter '*.ps1') {
            $bytes = [System.IO.File]::ReadAllBytes($f.FullName)
            # Rich GUI smoke fixtures explicitly use UTF-8 with BOM, which
            # Windows PowerShell 5.1 decodes correctly. BOM-less distributed
            # installers must remain ASCII.
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              $null = [Text.UTF8Encoding]::new($false, $true).GetString($bytes,3,$bytes.Length-3)
              continue
            }
            for ($i = 0; $i -lt $bytes.Length; $i++) {
              if ($bytes[$i] -gt 127) {
                $bad += "$($f.Name) at byte offset $i"
                break
              }
            }
          }
          if ($bad.Count -gt 0) {
            foreach ($b in $bad) { Write-Host "::error::$b contains non-ASCII bytes" }
            throw 'PowerShell scripts must be ASCII-only (or given a UTF-8 BOM)'
          }
          Write-Host 'all PowerShell scripts are ASCII or valid UTF-8 with BOM'

      - name: installer PATH logic tests
        shell: pwsh
        run: pwsh -NoProfile -File scripts/tests/install-path.tests.ps1
