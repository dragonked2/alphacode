name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: build (${{ matrix.os }} / ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        profile: [release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # `xa11y`'s Linux accessibility backend links the system libxkbcommon.
          # Without the -dev package (which provides the `libxkbcommon.so`
          # symlink used by `-lxkbcommon`) the build fails with:
          #   rust-lld: error: unable to find library -lxkbcommon
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: clippy, rustfmt

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.os }}-${{ matrix.profile }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.os }}-${{ matrix.profile }}-
            cargo-${{ matrix.os }}-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo build --release
        run: cargo build --release --locked

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # See the build job: libxkbcommon is a hard link-time dep on Linux.
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo test --lib --locked
      - run: cargo test --test llamacpp_compat --locked
      # `alphagrep` is its own workspace member, so root-package commands
      # never run its tests; gate them here.
      - run: cargo test -p alphagrep --locked

  perf-gates:
    name: perf gates
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          # See the build job: libxkbcommon is a hard link-time dep on Linux.
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-perf-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
            cargo-
      # Release profile: the budgets and the scaling curves are only
      # meaningful against the build that ships. `--test-threads=1` because the
      # gates compare timings and must not contend with each other.
      #
      # These fail on hardware-independent complexity regressions only. The
      # wall-clock budgets inside the suite are reported but not enforced on a
      # shared runner; see the module docs in tests/perf_gates.rs for why
      # enforcing them in CI would produce flaky, unactionable failures.
      - run: >
          cargo test --release --locked --test perf_gates
          -- --nocapture --test-threads=1

  lint:
    name: clippy
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          # See the build job: libxkbcommon is a hard link-time dep on Linux.
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-lint-${{ hashFiles('Cargo.lock') }}
      - run: cargo clippy --locked --lib --all-targets -- -D warnings
      # Same gap as in the test job: the workspace member needs its own run.
      - run: cargo clippy -p alphagrep --locked --all-targets -- -D warnings

  installer-smoke:
    name: installer smoke
    runs-on: ubuntu-latest
    needs: build
      # Sanity-check the install scripts' syntax without actually
      # downloading a release (we don't have one in CI).
    steps:
      - uses: actions/checkout@v4
      - name: bash -n scripts/install.sh
        run: bash -n scripts/install.sh
      - name: bash -n scripts/uninstall.sh
        run: bash -n scripts/uninstall.sh
      - name: pwsh parse check on the PowerShell scripts
        shell: pwsh
        run: |
          # Parse, do not tokenize. PSParser::Tokenize only splits text into
          # tokens and never checks that they form a valid script, so it passes
          # on files that cannot actually run.
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path scripts -Recurse -Filter '*.ps1'
          if ($files.Count -eq 0) { throw 'no .ps1 scripts found' }
          foreach ($f in $files) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $f.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              foreach ($e in $errors) { Write-Host "::error file=$($f.FullName):: $($e.Message)" }
              throw "parse errors in $($f.Name)"
            }
          }
          Write-Host "parsed $($files.Count) PowerShell script(s)"

      - name: PowerShell scripts are ASCII-only
        shell: pwsh
        run: |
          # install.ps1 is distributed as `iwr ... | iex` and is routinely run by
          # Windows PowerShell 5.1, which decodes a BOM-less file as the
          # ANSI code page. In CP1252 the byte 0x94 is a right double quote, so a
          # UTF-8 em dash (E2 80 94) decodes to mojibake *plus a closing quote*
          # and silently truncates the surrounding string into a syntax error.
          # install.ps1 already carried one em dash and CI's Tokenize check
          # could not have caught it. Keep these files ASCII.
          $ErrorActionPreference = 'Stop'
          $bad = @()
          foreach ($f in Get-ChildItem -Path scripts -Recurse -Filter '*.ps1') {
            $bytes = [System.IO.File]::ReadAllBytes($f.FullName)
            for ($i = 0; $i -lt $bytes.Length; $i++) {
              if ($bytes[$i] -gt 127) {
                $bad += "$($f.Name) at byte offset $i"
                break
              }
            }
          }
          if ($bad.Count -gt 0) {
            foreach ($b in $bad) { Write-Host "::error::$b contains non-ASCII bytes" }
            throw 'PowerShell scripts must be ASCII-only (or given a UTF-8 BOM)'
          }
          Write-Host 'all PowerShell scripts are ASCII-only'

      - name: installer PATH logic tests
        shell: pwsh
        run: pwsh -NoProfile -File scripts/tests/install-path.tests.ps1