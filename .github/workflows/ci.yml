name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: build (${{ matrix.os }} / ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        profile: [release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # `xa11y`'s Linux accessibility backend links the system libxkbcommon.
          # Without the -dev package (which provides the `libxkbcommon.so`
          # symlink used by `-lxkbcommon`) the build fails with:
          #   rust-lld: error: unable to find library -lxkbcommon
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: clippy, rustfmt

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.os }}-${{ matrix.profile }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.os }}-${{ matrix.profile }}-
            cargo-${{ matrix.os }}-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo build --release
        run: cargo build --release --locked

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # See the build job: libxkbcommon is a hard link-time dep on Linux.
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo test --lib --locked
      - run: cargo test --test llamacpp_compat --locked

  lint:
    name: clippy
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          # See the build job: libxkbcommon is a hard link-time dep on Linux.
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-lint-${{ hashFiles('Cargo.lock') }}
      - run: cargo clippy --locked --lib --all-targets -- -D warnings

  installer-smoke:
    name: installer smoke
    runs-on: ubuntu-latest
    needs: build
      # Sanity-check the install scripts' bash syntax without actually
      # downloading a release (we don't have one in CI).
    steps:
      - uses: actions/checkout@v4
      - name: bash -n scripts/install.sh
        run: bash -n scripts/install.sh
      - name: bash -n scripts/uninstall.sh
        run: bash -n scripts/uninstall.sh
      - name: pwsh syntax check on scripts/install.ps1
        shell: pwsh
        run: >-
          $null = [System.Management.Automation.PSParser]::Tokenize(
          (Get-Content -Raw scripts/install.ps1), [ref]$null)