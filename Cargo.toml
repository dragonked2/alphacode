[package]
name = "alphacode"
version = "1.0.12"
authors = ["Ali Essam <tlbbeg313@gmail.com>"]
description = "A coding agent for the terminal. Multi-model orchestration, swarm coordination, and 40+ tools working together — built so the changes it makes are the smallest ones that solve the problem."
edition = "2024"

[workspace]

[lib]
name = "alphacode"
path = "src/lib.rs"

[[bin]]
name = "alphacode"
path = "src/main.rs"

[build-dependencies]

[dependencies]
# Memory allocator
tikv-jemallocator = { version = "0.6", features = ["unprefixed_malloc_on_supported_platforms"], optional = true }
tikv-jemalloc-ctl = { version = "0.6", optional = true }
tikv-jemalloc-sys = { version = "0.6", optional = true }

# Async runtime
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
futures = "0.3"
async-trait = "0.1"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "charset", "http2", "rustls-tls", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.8"
serde_yaml = "0.9"
pulldown-cmark = "0.12"

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
dirs = "5"
anyhow = "1"
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
open = "5"
uuid = { version = "1", features = ["v4", "v5"] }
rand = "0.9.3"
regex = "1"
glob = "0.3"
url = "2"
urlencoding = "2"
base64 = "0.22"
tempfile = "3"
flate2 = "1"
tar = "0.4"
# Windows release assets are published as `.zip` (see release.yml +
# scripts/install.ps1). The in-app updater used to silently fail on
# Windows because it had no zip extractor at all.
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "1"
proctitle = "0.1"
memchr = "2"
http = "1"
h2 = "0.4"
bytes = "1"
webpki-roots = "1"
walkdir = "2"
wait-timeout = "0.2"
agentgrep = { git = "https://github.com/1jehuang/agentgrep.git", tag = "v0.1.6" }

# TUI
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui-image = { version = "10.0.6", default-features = false, features = ["crossterm"] }
terminal-colorsaurus = "1.0"

# Unicode
unicode-width = "0.2"
unicode-segmentation = "1"
unicode-properties = { version = "0.1", features = ["emoji"] }

# Image processing
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Text rendering
resvg = "0.46"
usvg = "0.46"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
mdwright-latex = "0.1.3"
arboard = { version = "3", features = ["wayland-data-control"] }

# Optional integrations
imap = { version = "3.0.0-alpha.15", default-features = true, optional = true }
lettre = { version = "0.11.22", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"], optional = true }
mail-parser = { version = "0.9", optional = true }

# Embeddings (optional)
tokenizers = { version = "0.21", default-features = false, features = ["onig"], optional = true }
tract-hir = { version = "0.23", optional = true }
tract-onnx = { version = "0.23", optional = true }
tract-core = { version = "0.23", optional = true }
tract-linalg = { version = "0.23", optional = true }
tract-data = { version = "0.23", optional = true }
tract-nnef = { version = "0.23", optional = true }
tract-onnx-opl = { version = "0.23", optional = true }
ndarray = { version = "0.16", optional = true }

# PDF (optional)
pdf-extract = { version = "0.12", optional = true }

# Bedrock / AWS (optional)
aws-config = { version = "1.9.0", default-features = false, features = ["default-https-client", "rt-tokio", "credentials-process", "sso"], optional = true }
aws-credential-types = { version = "1.3.0", optional = true }
aws-sdk-bedrock = { version = "1.148.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-bedrockruntime = { version = "1.136.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-sts = { version = "1.108.0", default-features = false, features = ["default-https-client", "rt-tokio", "sigv4a"], optional = true }
aws-smithy-types = { version = "1.6.1", optional = true }
aws-types = { version = "1.4.0", optional = true }

rayon = "1"
similar = "2"

# Azure auth (optional)
azure_core = { version = "1", optional = true }

# QR code generation
qrcode = "0.14"

httpdate = "1"
azure_identity = { version = "1", default-features = false, features = ["tokio"], optional = true }

# Mermaid rendering (optional)
mermaid-rs-renderer = { git = "https://github.com/1jehuang/mermaid-rs-renderer.git", tag = "v0.3.1", optional = true }

# Native TLS (optional, for linux-compat-vendored-openssl)
native-tls = { version = "0.2.18", optional = true }

[features]
# Heavy optional stacks are opt-in for fast default builds:
#   bedrock (AWS SDK, ~25 codegen-heavy crates)      -> --features bedrock
#   mermaid-renderer / mmdr-size-api (SVG rendering) -> --features mermaid-renderer
#   embeddings (local ONNX model via tract + tokenizers, ~40 heavy crates)
#                                                    -> --features embeddings
#   pdf (pdf-extract text extraction, ~15 crates)    -> --features pdf
default = ["serde"]
email = ["dep:lettre", "dep:imap", "dep:mail-parser"]
azure-auth = ["dep:azure_core", "dep:azure_identity"]
pdf = ["dep:pdf-extract"]
embeddings = ["dep:tokenizers", "dep:tract-hir", "dep:tract-onnx", "dep:tract-core", "dep:tract-linalg", "dep:tract-data", "dep:tract-nnef", "dep:tract-onnx-opl", "dep:ndarray"]
bedrock = ["aws-sdk"]
aws-sdk = ["dep:aws-config", "dep:aws-credential-types", "dep:aws-sdk-bedrock", "dep:aws-sdk-bedrockruntime", "dep:aws-sdk-sts", "dep:aws-smithy-types", "dep:aws-types"]
jemalloc = ["dep:tikv-jemalloc-ctl", "dep:tikv-jemalloc-sys", "tikv-jemalloc-ctl/stats"]
jemalloc-prof = ["jemalloc", "dep:tikv-jemalloc-sys", "tikv-jemalloc-sys/profiling"]
linux-compat-vendored-openssl = ["dep:native-tls", "native-tls/vendored"]
mmdr-size-api = ["dep:mermaid-rs-renderer", "renderer"]
renderer = ["dep:mermaid-rs-renderer"]
mermaid-renderer = ["dep:mermaid-rs-renderer"]
serde = []
dev-bins = []
test-support = []

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Power", "Win32_UI", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

# macOS-only bindings: CoreGraphics for synthetic input via `tool::computer`,
# plus the global hotkey crate and the objc2 stack for the menubar status item.
# Other targets never pull these in because every consumer is gated behind
# `cfg(target_os)`.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.23", features = ["highsierra"] }
global-hotkey = "0.7"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSThread",
    "NSRunLoop",
    "NSDate",
    "NSTimer",
    "NSUserDefaults",
    "NSValue",
    "NSAttributedString",
    "NSDictionary",
    "block2",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSAppearance",
    "NSApplication",
    "NSResponder",
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSFontDescriptor",
    "NSImage",
    "NSAttributedString",
    "NSMenu",
    "NSMenuItem",
    "NSRunningApplication",
] }

[profile.release]
# opt-level 3 keeps peak runtime performance; thin LTO + 16 codegen units cut
# release build time several-fold vs fat LTO / a single codegen unit for only a
# small (~2-8%) runtime cost on a few hot paths.
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
debug = 0
incremental = false

# Hot third-party crates (the AI/HTTP stack) get pushed to a single codegen
# unit so inlining + cross-crate LTO can fold them into the binary tightly.
# Cold heavy crates (syntect, resvg, usvg, image, terminal-colorsaurus, etc.)
# stay at the fast 16-unit setting so release builds don't balloon.
[profile.release.package."reqwest"]
opt-level = 3
codegen-units = 1
[profile.release.package."hyper"]
opt-level = 3
codegen-units = 1
[profile.release.package."tokio"]
opt-level = 3
codegen-units = 1
[profile.release.package."rustls"]
opt-level = 3
codegen-units = 1
[profile.release.package."h2"]
opt-level = 3
codegen-units = 1
[profile.release.package."ratatui"]
opt-level = 3
codegen-units = 1
[profile.release.package."crossterm"]
opt-level = 3
codegen-units = 1

# Dev/test builds are tuned for compile speed, not runtime speed.
#
# First-party code runs at `opt-level = 1` with incremental caching; third-party
# dependencies build at `opt-level = 2` (was 3) which noticeably speeds up cold
# builds while keeping hot dependency code (ratatui, crossterm, tokio) fast.
# `debug = "line-tables-only"` keeps usable backtraces without the cost of full
# debug info. The heavy optional stacks (embeddings, pdf) are no longer in
# `default`, so cold builds skip ~150 dependency crates entirely.
#
# `panic = "abort"` is deliberately absent from `[profile.test]`: the test
# harness needs unwinding to catch and report `#[should_panic]` and failed
# assertions, and cargo ignores the key there anyway.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.test.package."*"]
opt-level = 2
